<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Parqueadero{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .stat-card { border-left: 4px solid; }
        .stat-card.activos { border-color: #198754; }
        .stat-card.hoy { border-color: #0d6efd; }
        .badge-activo { background-color: #198754; }
        .badge-finalizado { background-color: #6c757d; }
        .placa-badge {
            font-family: monospace;
            font-size: 1.1em;
            font-weight: 700;
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand" href="{% url 'parqueadero:inicio' %}">
            <i class="bi bi-p-circle-fill me-2"></i>Parqueadero
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'inicio' %}active{% endif %}"
                       href="{% url 'parqueadero:inicio' %}">
                        <i class="bi bi-house me-1"></i>Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'registrar_entrada' %}active{% endif %}"
                       href="{% url 'parqueadero:registrar_entrada' %}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Registrar Entrada
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'registrar_salida' %}active{% endif %}"
                       href="{% url 'parqueadero:registrar_salida' %}">
                        <i class="bi bi-box-arrow-right me-1"></i>Registrar Salida
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'historial' %}active{% endif %}"
                       href="{% url 'parqueadero:historial' %}">
                        <i class="bi bi-clock-history me-1"></i>Historial
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'vehiculos' %}active{% endif %}"
                       href="{% url 'parqueadero:vehiculos' %}">
                        <i class="bi bi-car-front me-1"></i>Vehículos
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}

    {% block content %}{% endblock %}
</div>

<footer class="bg-dark text-white-50 text-center py-3 mt-5">
    <small>Sistema de Registro de Parqueadero &mdash; Servidor Público</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
